<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · Tasklane</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <main class="auth-shell">
    <button class="icon-btn auth-shell__theme" type="button" data-theme-toggle aria-label="Switch theme">
      <span class="icon-moon">☾</span><span class="icon-sun">☀</span>
    </button>

    <section class="card auth-card">
      <div class="auth-card__brand">
        <h1>Create your account</h1>
        <p class="field__hint">It takes less than a minute.</p>
      </div>

      <form class="form" action="register" method="post">
        <div class="field">
          <label for="full-name">Full name</label>
          <input class="input" id="full-name" name="full_name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
            <button class="password-wrap__toggle" type="button" data-password-toggle="password">Show</button>
          </div>
          <p class="field__hint">Use at least 8 characters.</p>
        </div>
        <button class="btn btn--block" type="submit">Create account</button>
      </form>

      <p class="auth-card__alt">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <script src="js/password.js"></script>
</body>
</html>
